<link rel="stylesheet" href="style.css">
<script>
if (location.protocol === 'http:' || location.protocol === 'https:') {
  const m = document.createElement('link');
  m.rel = 'manifest'; m.href = 'manifest.json';
  document.head.appendChild(m);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
}
</script>
</head>
<body data-page="smoke">
<a id="skip-link" href="#dlg" class="skip-link">Salta al testo</a>
<div id="crt">
  <main class="container" role="main">
    <div id="top-bar" class="top-bar"></div>
    <div class="story-grid">
      <!-- COLONNA SINISTRA SU PC: Immagine + Prompt sotto -->
      <div class="left-col">
        <div id="img-container" role="region" aria-label="Visual Monitor"></div>
        <div id="promptbox" role="region" aria-labelledby="req-txt" style="display:none">
          <div id="req-txt" style="margin-bottom:8px;color:#88ff88;font-size:0.95em"></div>
          <input id="pin" type="text" placeholder="digita il comando" autocomplete="off" aria-describedby="req-txt" onkeydown="if(event.key==='Enter')checkPrompt()">
          <button id="btn-go" type="button" class="go" onclick="checkPrompt()">INVIA</button>
          <div id="pmsg" role="alert" aria-live="assertive" style="margin-top:6px;min-height:1.2em"></div>
        </div>
      </div>
      <!-- COLONNA DESTRA SU PC: Testo da leggere + Scelte -->
      <div class="right-col">
        <article id="dlg" role="region" aria-live="polite" tabindex="0">Caricamento sistema...</article>
        <nav id="choices" role="navigation" aria-label="Scelte narrative"></nav>
      </div>
    </div>
    <footer class="nav-footer">
      <a id="link-back" href="index.html">← Menu principale</a>
      <a id="link-restart" href="#" onclick="showNode('start');return false">↻ Ricomincia percorso</a>
    </footer>
  </main>
</div>
<script src="engine.js"></script>
</body>
</html>
